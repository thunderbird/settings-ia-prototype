<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Thunderbird Settings Prototype</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app rail | settings nav | content pane of grouped cards. Components follow the Thunderbird design system: buttons, dropdown, input, counter, checkbox, radio, radio card, segmented control, banners, links, tooltip, divider. Icons: Phosphor (regular). */
:root{
  --bg:#ffffff; --panel:#fafafb; --head:#eeeef1; --line:#e0e0e6; --fg:#15141a; --muted:#5b5b6b;
  --accent:#3672d6; --accent-fill:#3672d6; --accent-ink:#2a4f8f; --accent-soft:#eaf1fc;
  --btn:#eeeef1; --btn-hover:#e4e4e8; --btn-active:#d6d6dc; --btn-bd:#dcdce0; --seg-bg:#f2f2f4;
  --ctl:#ffffff; --off:#8f8f9d; --field-bd:#757585; --field-hover:#4a4a58; --danger:#8e2421; --err:#c5362f; --ok:#2e6b3c;
  --b-info-bg:#f1f6fd; --b-info-bd:#2f6bd1; --b-info-fg:#234f9c;
  --b-ok-bg:#f2f8f2; --b-ok-bd:#2e6b3c; --b-ok-fg:#1f4d2a;
  --b-warn-bg:#fdf8e6; --b-warn-bd:#e8c34a; --b-warn-fg:#6b4a12;
  --b-crit-bg:#fdf1f0; --b-crit-bd:#a52a2a; --b-crit-fg:#5c0f0f;
  --rail:#2a2a52; --rail-fg:#c9c9e6; --shadow:0 1px 2px rgba(20,20,40,.06);
  --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --scale:1; --row-pad:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b22; --panel:#23222b; --head:#2d2c38; --line:#3d3c4a; --fg:#fbfbfe; --muted:#b2b1c0;
  --accent:#6aa0f5; --accent-ink:#a9c8ff; --accent-soft:#243a58;
  --btn:#383744; --btn-hover:#444354; --btn-active:#515063; --btn-bd:#4a4958; --seg-bg:#2a2935;
  --ctl:#2d2c38; --off:#6f6e80; --field-bd:#8c8ba0; --field-hover:#b2b1c0; --danger:#b3322e; --err:#ff8a82; --ok:#6fd98a;
  --b-info-bg:#262b40; --b-info-bd:#5ea0f0; --b-info-fg:#6db2ff;
  --b-ok-bg:#132b1b; --b-ok-bd:#4fbf6b; --b-ok-fg:#6fd98a;
  --b-warn-bg:#3f3513; --b-warn-bd:#e8c34a; --b-warn-fg:#f7e08a;
  --b-crit-bg:#75231f; --b-crit-bd:#e06b66; --b-crit-fg:#ffffff;
  --rail:#16152e; --rail-fg:#b9b9d8; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1b22; --panel:#23222b; --head:#2d2c38; --line:#3d3c4a; --fg:#fbfbfe; --muted:#b2b1c0;
  --accent:#6aa0f5; --accent-ink:#a9c8ff; --accent-soft:#243a58;
  --btn:#383744; --btn-hover:#444354; --btn-active:#515063; --btn-bd:#4a4958; --seg-bg:#2a2935;
  --ctl:#2d2c38; --off:#6f6e80; --field-bd:#8c8ba0; --field-hover:#b2b1c0; --danger:#b3322e; --err:#ff8a82; --ok:#6fd98a;
  --b-info-bg:#262b40; --b-info-bd:#5ea0f0; --b-info-fg:#6db2ff;
  --b-ok-bg:#132b1b; --b-ok-bd:#4fbf6b; --b-ok-fg:#6fd98a;
  --b-warn-bg:#3f3513; --b-warn-bd:#e8c34a; --b-warn-fg:#f7e08a;
  --b-crit-bg:#75231f; --b-crit-bd:#e06b66; --b-crit-fg:#ffffff;
  --rail:#16152e; --rail-fg:#b9b9d8; --shadow:none; color-scheme:dark}
:root[data-density="compact"]{--row-pad:8px}
:root[data-density="relaxed"]{--row-pad:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:calc(14px*var(--scale));line-height:1.45}
button,input,select{font:inherit;color:inherit}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* app frame */
.app{display:grid;grid-template-columns:64px 280px minmax(0,1fr);height:100%;min-height:560px}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;position:relative;z-index:5}
.rail button{position:relative;width:40px;height:40px;border:0;border-radius:8px;background:none;color:var(--rail-fg);display:grid;place-items:center;cursor:pointer}
.rail button:hover{background:rgba(255,255,255,.1)}
.rail .on{background:var(--accent-fill);color:#fff}
.rail .sp{flex:1}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--field-bd);background:var(--ctl);border-radius:4px;padding:0 8px 0 12px;height:44px;margin-bottom:12px}
.search:hover{border-color:var(--field-hover)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.navitem{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.navitem:hover{background:var(--btn)}
.navitem[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.navitem[aria-current="page"] svg{color:var(--accent)}
main{overflow:auto;padding:32px 40px 64px;min-width:0}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:calc(24px*var(--scale));font-weight:600;margin:0 0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.psub{margin:-12px 0 20px;color:var(--muted)}
.saved{font-size:calc(12px*var(--scale));font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 10px;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}

/* card, rows, faded divider */
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:12px;background:var(--head);padding:14px 16px;font-weight:600;font-size:calc(16px*var(--scale))}
.card>header svg{color:var(--accent)}
.cdesc{margin:0;padding:12px 24px 0;color:var(--muted)}
.rows{padding:0 24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:var(--row-pad) 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.lbl{min-width:0}
.lbl b{font-weight:400;color:var(--muted)}
.lbl.strong b{color:var(--fg);font-weight:500}
.lbl small{display:block;color:var(--muted);font-size:calc(12.5px*var(--scale));margin-top:2px;max-width:60ch}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.subh{position:relative;padding:16px 0 4px}
.subh::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent)}
.rows>.subh:first-child::before{display:none}
.subh b,.subh h3{margin:0;font-weight:600;font-size:calc(15px*var(--scale))}
.card>header h2{margin:0;font:inherit}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--bg);color:var(--accent);padding:8px 14px;border-radius:4px;border:2px solid var(--accent)}
.skip:focus{top:8px}
.subh small{display:block;color:var(--muted);font-size:calc(12.5px*var(--scale))}
.subh+.row{border-top:0}
.badge{margin-left:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px}
.row.beta{background:var(--accent-soft);border-radius:8px;border-top:0;padding:12px 14px;margin:12px -14px 4px}
.row.beta+.row{border-top:0}
.card.hl{box-shadow:0 0 0 3px var(--accent)}
.row.hl{background:var(--accent-soft);border-radius:8px;box-shadow:0 0 0 8px var(--accent-soft)}

/* buttons: secondary (default), primary, danger, small label, icon */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--btn-bd);border-radius:4px;background:var(--btn);font-weight:600;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.btn:hover:not(:disabled){background:var(--btn-hover)}
.btn:active:not(:disabled){background:var(--btn-hover);border-color:var(--field-hover)}
.btn:disabled{cursor:not-allowed;background:var(--btn);color:var(--off);box-shadow:none}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent-fill) 84%,#000);border-color:transparent}
.btn.primary:active:not(:disabled){background:color-mix(in srgb,var(--accent-fill) 68%,#000)}
.btn.primary:disabled{background:var(--btn);border-color:var(--btn-bd);color:var(--off)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover:not(:disabled){background:color-mix(in srgb,var(--danger) 82%,#000)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.ibtn{width:32px;height:32px;border:0;background:none;display:grid;place-items:center;border-radius:4px;cursor:pointer;color:inherit;flex:none}
.ibtn.round{border-radius:50%}
.ibtn:hover{background:var(--btn)}
.ibtn:active{background:var(--btn-hover)}

/* link */
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:2px 4px;cursor:pointer;font-weight:500}
.lnk:hover{color:var(--accent-ink)}

/* switch (kept for immediate on/off settings) */
.sw{width:44px;height:24px;border-radius:99px;border:0;background:var(--off);position:relative;cursor:pointer;transition:background .15s;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw::before{content:"";position:absolute;z-index:1;left:30px;top:7px;width:4px;height:8px;border:solid var(--accent-fill);border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0;transition:opacity .15s}
.sw[aria-checked="true"]::before{opacity:1}
.sw[aria-checked="true"]{background:var(--accent-fill)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* dropdown */
.selw{position:relative;display:inline-flex;align-items:center;max-width:100%}
.selw svg{position:absolute;right:12px;pointer-events:none}
.sel{appearance:none;-webkit-appearance:none;height:40px;border:1px solid var(--field-bd);background:var(--ctl);border-radius:4px;padding:0 36px 0 12px;min-width:220px;max-width:100%;cursor:pointer}
.sel:hover{border-color:var(--field-hover)}
.sel:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}

/* input and counter */
.field{display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:100%}
.inpw{position:relative;display:flex;align-items:center;max-width:100%}
.inp{height:40px;border:1px solid var(--field-bd);background:var(--ctl);border-radius:4px;padding:0 40px 0 12px;width:300px;max-width:100%}
.inp:hover{border-color:var(--field-hover)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.inpw .st{position:absolute;right:10px;display:grid;pointer-events:none}
.inpw.ok .st{color:var(--ok)}
.inpw.err .st{color:var(--err)}
.inpw.err .inp{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.ctr .inp{width:150px;border-radius:4px 0 0 4px;padding-right:76px}
.ctr .st{right:46px}
.step{display:flex;flex-direction:column;height:40px;width:36px;border:1px solid var(--field-bd);border-left-width:1px;border-radius:0 4px 4px 0;background:var(--ctl);overflow:hidden}
.step button{flex:1;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.step button+button{border-top:1px solid var(--line)}
.step button:hover{background:var(--btn)}
.fmsg{font-size:calc(12.5px*var(--scale))}
.fmsg.help{color:var(--muted)}
.fmsg.err{color:var(--err)}
.row:has(.field){align-items:flex-start}
.row:has(.field) .lbl{padding-top:10px}

/* segmented control */
.seg{display:inline-flex;background:var(--seg-bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:6px;height:34px;padding:0 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--ctl);border-color:var(--accent);color:var(--accent)}

/* checkbox and radio */
.opts{display:flex;flex-direction:column;gap:2px;margin:0 -10px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--btn)}
.opt span{min-width:0}
.opt b{font-weight:400;color:var(--fg)}
.opt input:checked+span b{font-weight:600}
.opt small{display:block;color:var(--muted);font-size:calc(12.5px*var(--scale));max-width:62ch}
input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:1px 0 0;flex:none;border:1.5px solid var(--field-bd);background:var(--ctl);cursor:pointer}
input[type=checkbox]{border-radius:4px}
input[type=radio]{border-radius:50%}
input[type=checkbox]:hover,input[type=radio]:hover{border-color:var(--accent)}
input[type=checkbox]:checked{background:var(--accent-fill) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><path fill='white' d='m229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69L218.34 66.34a8 8 0 0 1 11.32 11.32'/></svg>") center/14px no-repeat;border-color:var(--accent-fill)}
input[type=radio]:checked{border:2px solid var(--accent-fill);background:radial-gradient(circle,var(--accent-fill) 0 4.5px,transparent 5.5px),var(--ctl)}

/* radio card */
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;border:1px solid transparent;border-radius:8px;background:var(--ctl);cursor:pointer;overflow:hidden}
.rcard .rh{display:flex;gap:10px;align-items:center;padding:10px 12px;color:var(--accent-ink)}
.rcard .rh b{font-weight:700}
.rcard .rb{padding:8px 12px 14px;color:var(--fg);flex:1}
.rcard:hover .rh{background:color-mix(in srgb,var(--accent-fill) 82%,#000);color:#fff}
.rcard:hover .rh input{border-color:#fff}
.rcard:has(input:checked){border-color:var(--accent-fill);box-shadow:0 1px 4px rgba(54,114,214,.25)}
.rcard:has(input:checked) .rh{background:var(--accent-fill);color:#fff}
.rcard:has(input:checked) .rh input{border-color:#fff;background:radial-gradient(circle,#fff 0 4.5px,transparent 5.5px),transparent}
.rcard:has(input:checked) .rb{color:var(--accent-ink)}
.rec{margin-left:auto;background:#fff;color:#2a4f8f;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:3px}

/* banners */
.row.ban{border-top:0;padding:16px 0 4px}
.banner{border:1px solid;border-radius:4px;padding:12px 14px;width:100%}
.banner .bh{display:flex;align-items:center;gap:12px}
.banner .bh b{flex:1;font-weight:700}
.banner p{margin:6px 0 0 34px}
.banner .bl{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.banner .ibtn:hover{background:rgba(128,128,128,.2)}
.banner .lnk{color:inherit}
.bcta{margin:6px 0 0 30px}
.banner.info{background:var(--b-info-bg);border-color:var(--b-info-bd);color:var(--b-info-fg)}
.banner.success{background:var(--b-ok-bg);border-color:var(--b-ok-bd);color:var(--b-ok-fg)}
.banner.warning{background:var(--b-warn-bg);border-color:var(--b-warn-bd);color:var(--b-warn-fg)}
.banner.critical{background:var(--b-crit-bg);border-color:var(--b-crit-bd);color:var(--b-crit-fg)}

/* tooltip */
[data-tip]::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--ctl);color:var(--fg);padding:6px 10px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:40}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}

/* file row, preview, table */
.file{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--field-bd);background:var(--ctl);border-radius:4px;padding:6px 8px 6px 12px;min-width:0}
.file span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file span.has{color:var(--fg)}
.file .btn{height:36px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .6s infinite alternate}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:4px}to{height:16px}}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acc{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--ctl);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.acc[aria-pressed="true"]{border-color:var(--accent)}
.acc i{width:18px;height:18px;border-radius:50%;flex:none}
.preview{border:1px solid var(--line);border-radius:8px;background:var(--ctl);overflow:hidden}
.msg{display:flex;gap:12px;align-items:center;padding:var(--row-pad) 14px;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg .av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.msg .t{min-width:0;flex:1}
.msg .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .t small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.msg time{color:var(--muted);font-size:12px}
.msg.read b{font-weight:400}
.msg .who{font-weight:500}
.tbl{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr) 70px;gap:12px;padding:var(--row-pad) 14px;border-top:1px solid var(--line)}
.tbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl.hd{border-top:0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--head)}
.tbl.read{color:var(--muted)}
.preview.hs{overflow-x:auto}.preview.hs>.tbl{min-width:640px}
.dot{width:16px;height:16px;border-radius:50%;flex:none}

/* mobile transfer flow, sync */
.ok-pill{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.note{color:var(--muted);font-size:calc(12.5px*var(--scale));margin:0}
.row.mobqr{align-items:flex-start;justify-content:flex-start;gap:24px;flex-wrap:wrap}
.qrbox{display:flex;flex-direction:column;gap:6px;background:#fff;padding:12px;border-radius:8px;border:1px solid var(--line);align-items:center}
.qrbox .note{color:#5b5b6b;font-size:12px}
.mobprog{margin:0}
.steps{margin:8px 0 16px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sumlist{margin:0;padding-left:20px}
.mobhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mtile{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--ctl);border-radius:8px;padding:12px;cursor:pointer}
.mtile:hover{border-color:var(--accent)}
.mtile:has(input:checked){border-color:var(--accent-fill);background:var(--accent-soft)}
.mtile input{margin:0}
.mtile .mav{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mtile:has(input:checked) .mav{background:var(--accent-fill);color:#fff}
.mtile .mt{min-width:0}
.mtile .mt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtile .mt small{color:var(--muted)}
fieldset.mob{border:0;margin:0;padding:0;min-width:0}
fieldset.mob legend{padding:0 0 4px}

/* dialog, toast, misc */
.pop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:8px;max-width:440px;width:100%;padding:20px 24px;display:flex;flex-direction:column;gap:2px}
.dlg h2{margin:0 40px 4px 0;font-size:18px;font-weight:600}
.dlg .dclose{position:absolute;right:12px;top:12px}
.dlg .row{padding:12px 0}
.dlg .foot{display:flex;justify-content:flex-end;margin-top:8px}
.empty,.stubpane{color:var(--muted);padding:48px 0;text-align:center}
.crumb{font-size:12px;color:var(--muted);margin:0 0 6px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.tip{margin:24px 0 0;color:var(--muted);font-size:12.5px}
.stubnote{color:var(--muted);margin:-8px 0 20px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}

@media (max-width:900px) and (min-width:561px){
  .app{grid-template-columns:56px 220px minmax(0,1fr)}
  main{padding:24px 20px 48px}
  .rows{padding:0 16px}.row{flex-wrap:wrap}
  .ctl{justify-content:flex-start}.file{flex-wrap:wrap}.sel{min-width:0}
}
@media (max-width:560px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);height:auto}
  .rail{flex-direction:row;padding:8px 16px;justify-content:flex-start}.rail .sp{display:none}
  [data-tip]::after{display:none}
  #navlist{display:flex;flex-wrap:wrap;gap:4px}
  .nav{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .navitem{width:auto;height:36px;padding:0 10px}.navitem span{display:none}.navitem[aria-current="page"] span{display:inline}
  main{padding:24px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
  .rows{padding:0 16px}.row{flex-wrap:wrap}
  .ctl{justify-content:flex-start}.file{flex-wrap:wrap}.rcards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 const fin=(r,c)=>[[0,0],[0,n-7],[n-7,0]].some(a=>r>=a[0]&&r<a[0]+7&&c>=a[1]&&c<a[1]+7);
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){let on;if(fin(r,c)){const a=r<7?0:n-7,b=c<7?0:n-7,rr=r-a,cc=c-b;on=rr===0||rr===6||cc===0||cc===6||(rr>=2&&rr<=4&&cc>=2&&cc<=4)}else on=rnd()>.52;if(on)cells+=`<rect x="${c}" y="${r}" width="1" height="1"/>`}

  case 'seg':return `<div class="seg" role="group" aria-label="${esc(r.label)}">${r.opts.map(o=>`<button data-k="${r.k}" data-v="${o[0]}" aria-pressed="${S[r.k]===o[0]}">${o[2]?ic(o[2],18):''}${o[1]}</button>`).join('')}</div>`;
  case 'path':return `<div class="file" style="min-width:300px"><span class="has">${esc(S.dlpath)}</span><button class="btn" data-act="pickdir">${ic('upload',18)}Choose</button></div>`;
  case 'text':return `<span style="color:var(--muted)">${r.get?r.get():r.value}</span>`;
  case 'input':return `<div class="field"><div class="inpw"><input class="inp" type="text" id="f-${r.k}" data-k="${r.k}" data-help="${esc(r.help||'')}" value="${esc(S[r.k])}" aria-label="${esc(r.label)}"></div></div>`;
  case 'counter':{const st=r.step||1;return `<div class="field"><div class="inpw ctr"><input class="inp" type="text" inputmode="numeric" id="f-${r.k}" data-k="${r.k}" data-min="${r.min}" data-max="${r.max}" data-help="${esc(r.help||'')}" value="${esc(S[r.k])}" aria-label="${esc(r.label)}"><div class="step"><button type="button" data-step="${st}" data-k2="${r.k}" aria-label="Increase">${ic('caretUp',14)}</button><button type="button" data-step="-${st}" data-k2="${r.k}" aria-label="Decrease">${ic('caretDown',14)}</button></div></div></div>`}
  case 'acctpick':return selw('data-acct="1"',Object.keys(ACCTS).map(id=>[id,acctName(id)]),S.acct,'Account')+`<button class="btn primary" data-act="stub">${ic('plus',18)}Add account…</button><button class="btn danger" data-act="stub">Remove</button>`;
  case 'cat':return `<span class="dot" style="background:${r.color}"></span><button class="btn" data-act="stub">Edit</button><button class="btn danger" data-act="stub">Delete</button>`;
  case 'btn':return `<button class="btn" data-act="stub">${r.btn}</button>`;
  case 'btns':return r.btns.map(b=>`<button class="btn" data-act="stub">${b}</button>`).join('');
  case 'links':return r.links.map(l=>`<a href="#" class="lnk" data-act="stub">${l}</a>`).join('');
  case 'syncstatus':return S.syncIn?`<span class="ok-pill">${ic('checkCircle',16)}Signed in as ${esc(ACCTS.work.email)}</span><button class="btn" data-act="syncout">Sign out…</button>`:`<span style="color:var(--muted)">Not signed in</span><button class="btn primary" data-act="syncin">Sign in to Sync…</button>`;
  case 'link':return `<a href="#" class="lnk"${r.focus?` data-focus="${r.focus}"`:''} data-nav="${r.to}">${r.btn}${ic('arrowRight',16)}</a>`;
  case 'buttons':return `<button class="btn" data-act="appicons">${ic('bell',18)}App icons</button><button class="btn" data-act="alerts">${ic('envx',18)}Modify alerts</button>`;
 }return'';
}
const ACC=[['os','Follow operating system',null],['thunderbird','Thunderbird blue',['#3672d6','#6aa0f5']],['purple','Purple',['#7b3fe4','#b794ff']],['orange','Orange',['#b34e00','#ff9d5c']],['pink','Pink',['#c42a74','#ff7fb5']],['ink','Ink',['#3b3b4f','#c2c2d6']],['teal','Teal',['#077373','#4fd1c5']]];
function isDark(){return S.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function row(r){
 if(r.type==='banner')return banner(r);
 if(r.type==='mobileflow')return mobileFlow();
 if(r.type==='betalink')return `<div class="row beta"><div class="lbl strong"><b>${hl(r.label)}</b><span class="badge">Beta</span><small>${hl(r.desc)}</small></div><div class="ctl"><span style="color:var(--muted)">${S[r.k]?'On':'Off'}</span><a href="#" class="lnk" data-nav="beta" data-focus="${r.k}">Try it in Beta features${ic('arrowRight',16)}</a></div></div>`;
 if(r.type==='sub')return `<div class="subh"><h3>${hl(r.label)}</h3>${r.desc?`<small>${hl(r.desc)}</small>`:''}</div>`;
 if(r.type==='radios')return radiosHTML(r);
 if(r.type==='checks')return `<div class="row col"><div class="lbl"><b>${hl(r.label)}</b>${r.desc?`<small>${hl(r.desc)}</small>`:''}</div><div class="opts ${r.inline?'inline':''}" role="group" aria-label="${esc(r.label)}">${r.opts.map(o=>`<label class="opt"><input type="checkbox" data-k="${o[0]}"${S[o[0]]?' checked':''}><span><b>${hl(o[1])}</b>${o[2]?`<small>${hl(o[2])}</small>`:''}</span></label>`).join('')}</div></div>`;
 if(r.type==='swatches')return `<div class="row col"><div class="lbl"><b>${hl(r.label)}</b></div><div class="accs">${ACC.map(a=>`<button class="acc" data-accent="${a[0]}" aria-pressed="${S.accent===a[0]}"><i style="background:${a[2]?a[2][isDark()?1:0]:'conic-gradient(#0a6bd8,#d3307f,#d9610a,#0a8a8a,#0a6bd8)'}"></i>${a[1]}</button>`).join('')}</div></div>`;
 if(r.type==='preview'){const m=[['Maya Chen','Design review notes','Attached the updated settings flow for the review on Thursday, plus notes from the last round.','9:41',0],['Build bot','Nightly build #4812 passed','All 3,204 tests passed on Linux, macOS and Windows with no new warnings.','8:12',1],['Jonas Weber','Re: Translation strings','Thanks, merged into the branch. German and Dutch are ready for another look.','Tue',1],['Priya Nair','Lunch Thursday?','Same place as last time works for me, around noon if that suits everyone.','Mon',1]];
  const tb=S.viewStyle==='table';
  const body=tb?`<div class="tbl hd"><span>Subject</span><span>From</span><span>Date</span></div>`+m.map(x=>`<div class="tbl ${x[4]?'read':''}"><span>${x[1]}</span><span>${x[0]}</span><span>${x[3]}</span></div>`).join('')
   :m.map(x=>`<div class="msg ${x[4]?'read':''}"><div class="av">${x[0].split(' ').map(w=>w[0]).join('')}</div><div class="t"><b>${x[1]}</b><small class="who">${x[0]}</small>${S.cardRows==='3'?`<small>${x[2]}</small>`:''}</div><time>${x[3]}</time></div>`).join('');
  return `<div class="row col"><div class="lbl"><b>${hl(r.label)}</b></div><div class="preview ${tb&&S.hscroll?'hs':''}">${body}</div></div>`}
 if(r.type==='file'){const off=!S.sound;
  return `<div class="row col"${off?' style="opacity:.55"':''}><div class="lbl strong"><b>${hl(r.label)}</b></div><div class="file"><span class="${S.file?'has':''}">${S.file?esc(S.file):'Audio file'}</span><div class="ctl"><button class="btn" data-act="browse"${off?' disabled':''}>${ic('upload',18)}Browse</button><button class="btn" data-act="play"${off?' disabled':''}>${playing?ic('stop',18)+'Stop <span class="eq"><i></i><i></i><i></i></span>':ic('play',18)+'Play'}</button></div></div></div>`}
 return `<div class="row"><div class="lbl"><b>${hl(r.label)}</b>${r.badge?`<span class="badge">${r.badge}</span>`:''}${r.desc?`<small>${hl(r.desc)}</small>`:''}</div><div class="ctl">${control(r)}</div></div>`;
}
function card(c){const rows=c.rows.filter(r=>!r.show||r.show());return `<section class="card"${c.id?` id="card-${c.id}"`:''}><header>${ic(c.icon,22)}<h2>${hl(c.title)}</h2></header>${c.desc?`<p class="cdesc">${hl(c.desc)}</p>`:''}<div class="rows">${rows.map(row).join('')}</div></section>`}
function matchRow(r,c,sec){return (r.label+' '+(r.desc||'')+' '+(r.opts||[]).map(o=>o.join(' ')).join(' ')+' '+(r.kw||'')+' '+c.title+' '+sec).toLowerCase().includes(query.toLowerCase())}

function renderPane(){
 const pane=document.getElementById('pane');
 if(query){
  let out='',cnt=0;
  for(const id of ['accounts','general','appearance','notifications','composition','privacy','calendar','chat','extensions','beta']){
   const sec=SECTIONS.find(s=>s.id===id);
   for(const c of CARDS[id]){const rows=c.rows.filter(r=>r.type!=='sub'&&r.type!=='banner'&&r.type!=='mobileflow'&&(!r.show||r.show())&&matchRow(r,c,sec.label));
    if(rows.length)cnt+=rows.length,out+=`<div class="crumb">${sec.label}</div>`+card({...c,rows})}
  }
  pane.innerHTML=`<h1 tabindex="-1">Search results</h1>`+(out||`<p class="empty">No settings match “${esc(query)}”. Try “sound”, “theme” or “language”.</p>`);
  paintAll();say(cnt+' setting'+(cnt==1?'':'s')+' found');return;
 }
 const sec=SECTIONS.find(s=>s.id===cur);
 pane.innerHTML=`<h1 tabindex="-1">${sec.label}<span class="saved" id="saved" aria-hidden="true">Saved</span></h1><p class="psub">${SUBT[cur]||''}</p>`+CARDS[cur].map(card).join('')+`<p class="tip">Changes apply immediately. Prototype state is kept in this browser only.</p>`;
 paintAll();
}
function renderNav(){
 document.getElementById('navlist').innerHTML=SECTIONS.map(s=>`<button class="navitem" data-nav="${s.id}" aria-label="${s.label}" ${(!query&&s.id===cur)?'aria-current="page"':''}>${ic(s.icon,22)}<span>${s.label}</span></button>`).join('');
}
function renderRail(){
 const b=[['mail','Mail',1],['book','Address book'],['cal','Calendar'],['task','Tasks'],['chat','Chat'],['sp'],['gear','Settings'],['collapse','Collapse sidebar']];
 document.getElementById('rail').innerHTML=b.map(x=>x[0]==='sp'?'<div class="sp"></div>':`<button aria-label="${x[1]}" data-tip="${x[1]}" class="${x[2]?'on':''}">${ic(x[0],22)}</button>`).join('');
}
function render(){applyTheme();renderNav();renderPane()}

function modal(html){const m=document.getElementById('modal'),app=document.querySelector('.app');
 if(!html){const op=modal.op;modal.op=null;m.innerHTML='';app.inert=false;if(op&&op.isConnected)op.focus();return}
 if(!modal.op)modal.op=document.activeElement;
 m.innerHTML=`<div class="pop" data-close><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><button class="ibtn round dclose" data-done aria-label="Close">${ic('x',18)}</button>${html.replace('<h2>','<h2 id="dlgt">')}</div></div>`;
 app.inert=true;const f=m.querySelector('button');if(f)f.focus()}
const miniToggle=(k,label)=>`<div class="row"><div class="lbl strong"><b>${label}</b></div><button class="sw" role="switch" aria-checked="${S[k]}" data-k="${k}" data-modal="1" aria-label="${label}"></button></div>`;
function dlgIcons(){modal(`<h2>App icons</h2>${miniToggle('alertBadge','Show unread count on the app icon')}<div class="row"><div class="lbl strong"><b>Badge style</b></div><div class="seg">${[['count','Count'],['dot','Dot']].map(o=>`<button data-k="iconBadge" data-v="${o[0]}" data-modal="1" aria-pressed="${S.iconBadge===o[0]}">${o[1]}</button>`).join('')}</div></div><div class="foot"><button class="btn primary" data-done>Done</button></div>`)}
function dlgAlerts(){modal(`<h2>Modify alerts</h2>${miniToggle('alertSender','Show the sender')}${miniToggle('alertPreview','Show a message preview')}<div class="foot"><button class="btn primary" data-done>Done</button></div>`)}

document.addEventListener('click',e=>{
 const bn=e.target.closest('[data-bnact]');
 if(bn){const id=bn.dataset.bn;if(bn.dataset.bnact==='close')DIS.add(id);else BN[id]=BN[id]===false;const m=document.querySelector('main'),st=m.scrollTop;renderPane();m.scrollTop=st;const bf=document.querySelector('[data-bn="'+id+'"][data-bnact="toggle"]');if(bf)bf.focus({preventScroll:true});return}
 const sp=e.target.closest('[data-step]');
 if(sp){const k=sp.dataset.k2,d=+sp.dataset.step,inp=document.querySelector('input.inp[data-k="'+k+'"]');const mn=+inp.dataset.min,mx=+inp.dataset.max;let v=parseInt(S[k],10);if(isNaN(v))v=mn;v=Math.min(mx,Math.max(mn,v+d));S[k]=String(v);inp.value=S[k];save();paintField(inp);flash();return}
 const t=e.target.closest('[data-done],[data-nav],[data-k],[data-theme-pick],[data-accent],[data-act],[data-close],#qx');if(!t)return;
 if(t.tagName==='A')e.preventDefault();
 if(t.hasAttribute('data-done')){modal('');return}
 if(t.hasAttribute('data-close')){if(e.target===t)modal('');return}
 if(t.id==='qx'){query='';document.getElementById('q').value='';t.hidden=true;render();return}
 if(t.dataset.nav){cur=t.dataset.nav;query='';document.getElementById('q').value='';document.getElementById('qx').hidden=true;
  try{history.replaceState(null,'','#'+cur)}catch(_){};render();if(t.dataset.focus)focusRow(t.dataset.focus);else{document.querySelector('main').scrollTop=0;const h=document.querySelector('#pane h1');if(h)h.focus({preventScroll:true})}return}
 if(t.dataset.accent){S.accent=t.dataset.accent;save();rerender('[data-accent="'+t.dataset.accent+'"]');flash();return}
 if(t.dataset.themePick){S.theme=t.dataset.themePick;save();rerender('[data-theme-pick="'+t.dataset.themePick+'"]');flash();return}
 if(t.dataset.act){const a=t.dataset.act;
  if(a==='browse'){S.file=S.file==='new-mail-chime.wav'?'soft-bell.mp3':'new-mail-chime.wav';playing=null;save();renderPane();flash()}
  else if(a==='play'){playing=playing?null:1;renderPane();if(playing){const id=playing=Date.now();setTimeout(()=>{if(playing===id){playing=null;renderPane()}},2200)}}
  else if(a==='pickdir'){S.dlpath=S.dlpath==='~/Downloads'?'~/Documents/Mail attachments':'~/Downloads';save();renderPane();flash()}
  else if(a==='stub')toast('Not wired up in this prototype');
  else if(a==='mobstart'){MOB.step=1;MOB.qr=1;renderPane();mobFocus()}
  else if(a==='mobnext'){const tot=Math.max(1,selAccts().length);if(MOB.qr<tot)MOB.qr++;else MOB.step=2;renderPane();mobFocus()}
  else if(a==='mobback'){if(MOB.qr>1)MOB.qr--;else MOB.step=0;renderPane();mobFocus()}
  else if(a==='mobreset'){MOB.step=0;renderPane();mobFocus()}
  else if(a==='mobselall'){Object.keys(ACCTS).forEach(id=>S['mob_'+id]=true);save();renderPane();mobFocus()}
  else if(a==='syncin'){S.syncIn=true;save();renderPane();flash()}
  else if(a==='syncout'){S.syncIn=false;save();renderPane();flash()}
  else if(a==='appicons')dlgIcons();
  else if(a==='alerts')dlgAlerts();
  return}
 if(t.dataset.k){const k=t.dataset.k;
  if(t.classList.contains('sw'))S[k]=!S[k];
  else if(t.dataset.v!==undefined)S[k]=t.dataset.v;
  else return;
  save();
  if(t.dataset.modal){k==='iconBadge'||k==='alertBadge'?dlgIcons():dlgAlerts();return}
  if(k==='sound'&&!S.sound)playing=null;
  rerender('[data-k="'+k+'"]'+(t.dataset.v!==undefined?'[data-v="'+t.dataset.v+'"]':''));flash()}
});
document.addEventListener('change',e=>{
 const tg=e.target;
 if(tg.dataset&&tg.dataset.k&&(tg.type==='radio'||tg.type==='checkbox')){const k=tg.dataset.k;S[k]=tg.type==='radio'?tg.value:tg.checked;save();
  const q=tg.type==='radio'?`input[data-k="${k}"][value="${tg.value}"]`:`input[data-k="${k}"]`;const m=document.querySelector('main'),st=m.scrollTop;render();m.scrollTop=st;
  const n=document.querySelector(q);if(n)n.focus({preventScroll:true});flash();return}
 if(e.target.dataset&&e.target.dataset.acct){switchAcct(e.target.value);save();rerender('select[data-acct]');flash();return}
 const k=e.target.dataset&&e.target.dataset.k;if(k&&e.target.tagName==='SELECT'){S[k]=e.target.value;save();flash()}});
document.addEventListener('input',e=>{
 if(e.target.type==='text'&&e.target.dataset.k){S[e.target.dataset.k]=e.target.value;save();paintField(e.target);flash();return}
 if(e.target.id==='q'){query=e.target.value.trim();document.getElementById('qx').hidden=!query;renderNav();renderPane();return}
});
document.addEventListener('click',e=>{if(e.target.closest('[data-skip]')){e.preventDefault();const h=document.querySelector('#pane h1');if(h)h.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal('')});
document.getElementById('ic-search').innerHTML=ic('search',20);document.getElementById('qx').innerHTML=ic('x',16);
renderRail();render();
</script>

</body></html>
