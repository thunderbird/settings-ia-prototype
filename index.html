  --accent:#54a3ff; --accent-soft:#243a58; --btn:#383744; --btn-hover:#444354; --rail:#16152e; --rail-fg:#b9b9d8;
  --ctl:#2d2c38; --off:#6f6e80; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#54a3ff; --accent-soft:#243a58; --btn:#383744; --btn-hover:#444354; --rail:#16152e; --rail-fg:#b9b9d8;
  --ctl:#2d2c38; --off:#6f6e80; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:calc(14px*var(--scale));line-height:1.45}
button,input,select{font:inherit;color:inherit}
svg{flex:none}

.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.rail button{width:40px;height:40px;border:0;border-radius:8px;background:none;color:var(--rail-fg);display:grid;place-items:center;cursor:pointer}
.rail button:hover{background:rgba(255,255,255,.1)}
.rail .on{background:#0a84ff;color:#fff}
.rail .sp{flex:1}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--ctl);border-radius:12px;padding:0 12px;height:44px;margin-bottom:12px}
.search:focus-within{outline:2px solid var(--accent)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.search button{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px;display:grid}
.navitem{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.navitem:hover{background:var(--btn)}
.navitem[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:500}
.navitem[aria-current="page"] svg{color:var(--accent)}
main{overflow:auto;padding:32px 40px 64px;min-width:0}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:calc(24px*var(--scale));font-weight:500;margin:0 0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.saved{font-size:calc(12px*var(--scale));font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 10px;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:12px;background:var(--head);padding:14px 16px;font-weight:500;font-size:calc(16px*var(--scale))}
.card>header svg{color:var(--accent)}
.rows{padding:0 24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:var(--row-pad) 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.lbl{min-width:0}
.lbl b{font-weight:400;color:var(--muted)}
.lbl.strong b{color:var(--fg);font-weight:500}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--btn);cursor:pointer}
.btn:hover:not(:disabled){background:var(--btn-hover)}
.btn:disabled{cursor:not-allowed}
.btn.primary{background:var(--accent);color:#fff}
.sw{width:44px;height:24px;border-radius:99px;border:0;background:var(--off);position:relative;cursor:pointer;transition:background .15s;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw::before{content:"";position:absolute;z-index:1;left:30px;top:7px;width:4px;height:8px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0;transition:opacity .15s}
.sw[aria-checked="true"]::before{opacity:1}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.inp{height:40px;border:1px solid var(--line);background:var(--ctl);border-radius:8px;padding:0 10px;width:min(280px,100%)}
.sel{height:40px;border:1px solid var(--line);background:var(--ctl);border-radius:8px;padding:0 10px;min-width:200px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--btn);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;height:34px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ctl);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:500}
.file{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--ctl);border-radius:8px;padding:6px 8px 6px 12px;min-width:0}
.file span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file span.has{color:var(--fg)}
.file .btn{height:36px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .6s infinite alternate}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:4px}to{height:16px}}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{border:2px solid var(--line);border-radius:12px;background:var(--ctl);padding:8px;cursor:pointer;text-align:left}
.tcard[aria-pressed="true"]{border-color:var(--accent)}
.tcard .pv{height:64px;border-radius:6px;display:grid;grid-template-columns:22% 1fr;overflow:hidden;border:1px solid rgba(128,128,128,.3)}
.tcard .pv i{display:block}
.tcard span{display:block;margin-top:8px;font-weight:500}
.range{display:flex;align-items:center;gap:12px;width:min(320px,100%)}
.range input{flex:1;accent-color:var(--accent)}
.preview{border:1px solid var(--line);border-radius:10px;background:var(--ctl);overflow:hidden}
.msg{display:flex;gap:12px;align-items:center;padding:var(--row-pad) 14px;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg .av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.msg .t{min-width:0;flex:1}
.msg .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .t small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.msg time{color:var(--muted);font-size:12px}
.msg.read b{font-weight:400}
.preview.noav .av{display:none}
.preview.table .t{display:flex;gap:12px}.preview.table .t b{width:30%;flex:none}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:20}

.crumb{font-size:12px;color:var(--muted);margin:0 0 6px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.tip{margin:24px 0 0;color:var(--muted);font-size:12.5px}

  .rows{padding:0 16px}.row{flex-wrap:wrap}.themes{grid-template-columns:1fr}
  .ctl{justify-content:flex-start}.file{flex-wrap:wrap}
}

.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.tbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  {type:'sub',label:'Icons'},
  {k:'notifyMail',label:'Turn on notifications for new emails',type:'toggle',kw:'alert new mail desktop'},
  {label:'Icons and alerts',type:'buttons',kw:'badge tray alert'},
  {type:'sub',label:'Calendar notifications'},
  {label:'Alarm style, missed reminders and sounds',type:'link',to:'calendar',btn:'Open Calendar settings',kw:'reminders alarms'},
  {type:'sub',label:'Chat notifications'},
  {label:'Chat message alerts and sounds',type:'link',to:'chat',btn:'Open Chat settings',kw:'messages'}]}
]};

const ACCTS={
 work:{acctName:'Work',yourName:'Sam Rivera',email:'sam@example.org',serverType:'IMAP',server:'imap.example.org',port:'993',security:'ssl',auth:'oauth',checkStart:true,checkMin:'10',smtp:'smtp.example.org',sentCopy:true,sentFolder:'sent',archiveFolder:'archives',htmlCompose:true,quote:true,replyPos:'below',useSig:true,junkMove:'junk',junkLog:false,offlineKeep:true,syncPeriod:'all',compactAuto:true,e2eeKey:'none',e2eeDefault:false,receipts:false},
 personal:{acctName:'Personal',yourName:'Sam Rivera',email:'sam.rivera@example.com',serverType:'POP3',server:'pop.example.com',port:'995',security:'ssl',auth:'password',checkStart:true,checkMin:'30',smtp:'smtp.example.com',sentCopy:true,sentFolder:'sent',archiveFolder:'archives',htmlCompose:false,quote:true,replyPos:'above',useSig:false,junkMove:'delete',junkLog:true,offlineKeep:true,syncPeriod:'all',compactAuto:false,e2eeKey:'0x4A1F…C2D9',e2eeDefault:true,receipts:false}
};
const AFIELDS=Object.keys(ACCTS.work);
function loadAcct(id){if(!ACCTS[id])id='work';Object.assign(S,ACCTS[id],(S.accts||{})[id]||{});S.acct=id}
function switchAcct(id){S.accts=S.accts||{};S.accts[S.acct]=Object.fromEntries(AFIELDS.map(f=>[f,S[f]]));loadAcct(id)}
function acctName(id){return id===S.acct?S.acctName:((S.accts||{})[id]||{}).acctName||ACCTS[id].acctName}
loadAcct(S.acct);
let cur=(location.hash||'#general').slice(1);
if(!SECTIONS.find(s=>s.id===cur))cur='general';
let query='',playing=null;

function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
 el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
function flash(){const el=document.getElementById('saved');if(el){el.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove('show'),1100)}}
function save(){S.accts=S.accts||{};S.accts[S.acct]=Object.fromEntries(AFIELDS.map(f=>[f,S[f]]));try{localStorage.setItem('tb-settings-proto',JSON.stringify(S))}catch(e){}}
function applyTheme(){
 const r=document.documentElement;
 if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
 r.setAttribute('data-density',S.density);
 const a=ACC.find(x=>x[0]===S.accent);
 if(a&&a[2]){const c=a[2][isDark()?1:0];r.style.setProperty('--accent',c);r.style.setProperty('--accent-soft','color-mix(in srgb,'+c+' 16%,var(--bg))')}else{r.style.removeProperty('--accent');r.style.removeProperty('--accent-soft')}
r.style.setProperty('--scale',S.fontsize/100);
}
function hl(t){if(!query)return esc(t);const i=t.toLowerCase().indexOf(query.toLowerCase());
 return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+query.length))+'</mark>'+esc(t.slice(i+query.length))}
function themeCard(v,name,a,b){return `<button class="tcard" data-theme-pick="${v}" aria-pressed="${S.theme===v}"><div class="pv" style="background:${b}"><i style="background:${a}"></i><i></i></div><span>${name}</span></button>`}
function control(r){
 switch(r.type){
  case 'toggle':return `<button class="sw" role="switch" aria-checked="${S[r.k]}" aria-label="${esc(r.label)}" data-k="${r.k}"></button>`;
  case 'select':return `<select class="sel" data-k="${r.k}" aria-label="${esc(r.label)}">${r.opts.map(o=>`<option value="${o[0]}"${S[r.k]===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;
  case 'seg':return `<div class="seg" role="group" aria-label="${esc(r.label)}">${r.opts.map(o=>`<button data-k="${r.k}" data-v="${o[0]}" aria-pressed="${S[r.k]===o[0]}">${o[1]}</button>`).join('')}</div>`;
  case 'range':return `<div class="range"><span aria-hidden="true" style="font-size:12px">A</span><input type="range" min="85" max="130" step="5" value="${S.fontsize}" data-k="fontsize" aria-label="Text size"><span aria-hidden="true" style="font-size:18px">A</span><output style="min-width:3.2em;text-align:right">${S.fontsize}%</output></div>`;
  case 'path':return `<div class="file" style="min-width:300px"><span class="has">${esc(S.dlpath)}</span><button class="btn" data-act="pickdir">${ic('upload',18)}Choose</button></div>`;
  case 'text':return `<span style="color:var(--muted)">${r.get?r.get():r.value}</span>`;
  case 'input':return `<input class="inp" type="text" id="f-${r.k}" data-k="${r.k}" value="${esc(S[r.k])}" aria-label="${esc(r.label)}">`;
  case 'acctpick':return `<select class="sel" data-acct="1" aria-label="Account">${Object.keys(ACCTS).map(id=>`<option value="${id}"${S.acct===id?' selected':''}>${esc(acctName(id))}</option>`).join('')}</select><button class="btn" data-act="stub">Add account…</button><button class="btn" data-act="stub">Remove</button>`;
  case 'cat':return `<span class="dot" style="background:${r.color}"></span><button class="btn" data-act="stub">Edit</button><button class="btn" data-act="stub">Delete</button>`;
  case 'btn':return `<button class="btn" data-act="stub">${r.btn}</button>`;
  case 'btns':return r.btns.map(b=>`<button class="btn" data-act="stub">${b}</button>`).join('');
  case 'link':return `<button class="btn" data-nav="${r.to}">${r.btn}</button>`;
  case 'buttons':return `<button class="btn" data-act="appicons">${ic('bell',18)}App icons</button><button class="btn" data-act="alerts">${ic('envx',18)}Modify alerts</button>`;
 }return'';
}
const ACC=[['os','Follow operating system',null],['thunderbird','Thunderbird blue',['#0a6bd8','#54a3ff']],['purple','Purple',['#7b3fe4','#b794ff']],['orange','Orange',['#d9610a','#ff9d5c']],['pink','Pink',['#d3307f','#ff7fb5']],['ink','Ink',['#3b3b4f','#c2c2d6']],['teal','Teal',['#0a8a8a','#4fd1c5']]];
function isDark(){return S.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function row(r){
 if(r.type==='sub')return `<div class="subh"><b>${hl(r.label)}</b>${r.desc?`<small>${hl(r.desc)}</small>`:''}</div>`;
 if(r.type==='radios')return `<div class="row col"><div class="lbl"><b>${hl(r.label)}</b>${r.desc?`<small>${hl(r.desc)}</small>`:''}</div><div class="opts" role="radiogroup" aria-label="${esc(r.label)}">${r.opts.map(o=>`<label class="opt"><input type="radio" name="${r.k}" data-k="${r.k}" value="${esc(o[0])}"${S[r.k]===o[0]?' checked':''}><span><b>${hl(o[1])}</b>${o[2]?`<small>${hl(o[2])}</small>`:''}</span></label>`).join('')}</div></div>`;
 if(r.type==='checks')return `<div class="row col"><div class="lbl"><b>${hl(r.label)}</b>${r.desc?`<small>${hl(r.desc)}</small>`:''}</div><div class="opts ${r.inline?'inline':''}" role="group" aria-label="${esc(r.label)}">${r.opts.map(o=>`<label class="opt"><input type="checkbox" data-k="${o[0]}"${S[o[0]]?' checked':''}><span><b>${hl(o[1])}</b>${o[2]?`<small>${hl(o[2])}</small>`:''}</span></label>`).join('')}</div></div>`;
 if(r.type==='themes')return `<div class="row col"><div class="lbl strong"><b>${hl(r.label)}</b></div><div class="themes">${themeCard('system','Follow system theme','#e8e8ee','#ffffff')}${themeCard('light','Light theme','#e8e8ee','#ffffff')}${themeCard('dark','Dark theme','#2d2c38','#1c1b22')}</div></div>`;
 if(r.type==='swatches')return `<div class="row col"><div class="lbl"><b>${hl(r.label)}</b></div><div class="accs">${ACC.map(a=>`<button class="acc" data-accent="${a[0]}" aria-pressed="${S.accent===a[0]}"><i style="background:${a[2]?a[2][isDark()?1:0]:'conic-gradient(#0a6bd8,#d3307f,#d9610a,#0a8a8a,#0a6bd8)'}"></i>${a[1]}</button>`).join('')}</div></div>`;
 if(r.type==='preview'){const m=[['Maya Chen','Design review notes','Attached the updated settings flow for the review on Thursday, plus notes from the last round.','9:41',0],['Build bot','Nightly build #4812 passed','All 3,204 tests passed on Linux, macOS and Windows with no new warnings.','8:12',1],['Jonas Weber','Re: Translation strings','Thanks, merged into the branch. German and Dutch are ready for another look.','Tue',1],['Priya Nair','Lunch Thursday?','Same place as last time works for me, around noon if that suits everyone.','Mon',1]];
  const tb=S.viewStyle==='table';
  const body=tb?`<div class="tbl hd"><span>Subject</span><span>From</span><span>Date</span></div>`+m.map(x=>`<div class="tbl ${x[4]?'read':''}"><span>${x[1]}</span><span>${x[0]}</span><span>${x[3]}</span></div>`).join('')
   :m.map(x=>`<div class="msg ${x[4]?'read':''}"><div class="av">${x[0].split(' ').map(w=>w[0]).join('')}</div><div class="t"><b>${x[1]}</b><small class="who">${x[0]}</small>${S.cardRows==='3'?`<small>${x[2]}</small>`:''}</div><time>${x[3]}</time></div>`).join('');
  return `<div class="row col"><div class="lbl"><b>${hl(r.label)}</b></div><div class="preview ${tb&&S.hscroll?'hs':''}">${body}</div></div>`}
 if(r.type==='file'){const off=!S.sound;
  return `<div class="row col"${off?' style="opacity:.55"':''}><div class="lbl strong"><b>${hl(r.label)}</b></div><div class="file"><span class="${S.file?'has':''}">${S.file?esc(S.file):'Audio file'}</span><div class="ctl"><button class="btn" data-act="browse"${off?' disabled':''}>${ic('upload',18)}Browse</button><button class="btn" data-act="play"${off?' disabled':''}>${playing?ic('stop',18)+'Stop <span class="eq"><i></i><i></i><i></i></span>':ic('play',18)+'Play'}</button></div></div></div>`}
 return `<div class="row"><div class="lbl"><b>${hl(r.label)}</b>${r.badge?`<span class="badge">${r.badge}</span>`:''}${r.desc?`<small>${hl(r.desc)}</small>`:''}</div><div class="ctl">${control(r)}</div></div>`;
}
function card(c){const rows=c.rows.filter(r=>!r.show||r.show());return `<section class="card"><header>${ic(c.icon,22)}${hl(c.title)}</header>${c.desc?`<p class="cdesc">${hl(c.desc)}</p>`:''}<div class="rows">${rows.map(row).join('')}</div></section>`}
function matchRow(r,c,sec){return (r.label+' '+(r.desc||'')+' '+(r.opts||[]).map(o=>o.join(' ')).join(' ')+' '+(r.kw||'')+' '+c.title+' '+sec).toLowerCase().includes(query.toLowerCase())}

function renderPane(){
 const pane=document.getElementById('pane');
 if(query){
  let out='';
  for(const id of ['accounts','general','appearance','notifications','composition','privacy','calendar','chat','extensions','beta']){
   const sec=SECTIONS.find(s=>s.id===id);
   for(const c of CARDS[id]){const rows=c.rows.filter(r=>r.type!=='sub'&&(!r.show||r.show())&&matchRow(r,c,sec.label));
    if(rows.length)out+=`<div class="crumb">${sec.label}</div>`+card({...c,rows})}
  }
  pane.innerHTML=`<h1>Search results</h1>`+(out||`<p class="empty">No settings match “${esc(query)}”. Try “sound”, “theme” or “language”.</p>`);
  return;
 }
 const sec=SECTIONS.find(s=>s.id===cur);
 if(sec.stub){const o=OUT[sec.id];pane.innerHTML=`<h1>${sec.label}</h1><p class="stubnote">Not built in this prototype yet. This is the planned structure.</p>`+(o?o.map(g=>`<section class="card"><header>${ic(sec.icon,22)}${g[0]}</header><div class="rows">${g[1].map(i=>`<div class="row"><div class="lbl"><b>${i}</b></div></div>`).join('')}</div></section>`).join(''):'<p class="stubpane">No groups defined yet.</p>');return}
 pane.innerHTML=`<h1>${sec.label}<span class="saved" id="saved" role="status">Saved</span></h1>`+CARDS[cur].map(card).join('')+`<p class="tip">Changes apply immediately. Prototype state is kept in this browser only.</p>`;
}
function renderNav(){
 document.getElementById('navlist').innerHTML=SECTIONS.map(s=>`<button class="navitem" data-nav="${s.id}" ${(!query&&s.id===cur)?'aria-current="page"':''}>${ic(s.icon,22)}<span>${s.label}</span></button>`).join('');
}
function renderRail(){
 const b=[['mail','Mail',1],['book','Address book'],['cal','Calendar'],['task','Tasks'],['chat','Chat'],['sp'],['gear','Settings'],['collapse','Collapse sidebar']];
 document.getElementById('rail').innerHTML=b.map(x=>x[0]==='sp'?'<div class="sp"></div>':`<button aria-label="${x[1]}" class="${x[2]?'on':''}">${ic(x[0],22)}</button>`).join('');
}
function render(){applyTheme();renderNav();renderPane()}

function modal(html){const m=document.getElementById('modal');m.innerHTML=html?`<div class="pop" data-close><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`:'';
 const f=m.querySelector('button');if(f)f.focus()}
const miniToggle=(k,label)=>`<div class="row"><div class="lbl strong"><b>${label}</b></div><button class="sw" role="switch" aria-checked="${S[k]}" data-k="${k}" data-modal="1" aria-label="${label}"></button></div>`;
function dlgIcons(){modal(`<h2>App icons</h2>${miniToggle('alertBadge','Show unread count on the app icon')}<div class="row"><div class="lbl strong"><b>Badge style</b></div><div class="seg">${[['count','Count'],['dot','Dot']].map(o=>`<button data-k="iconBadge" data-v="${o[0]}" data-modal="1" aria-pressed="${S.iconBadge===o[0]}">${o[1]}</button>`).join('')}</div></div><div class="foot"><button class="btn primary" data-done>Done</button></div>`)}
function dlgAlerts(){modal(`<h2>Modify alerts</h2>${miniToggle('alertSender','Show the sender')}${miniToggle('alertPreview','Show a message preview')}<div class="foot"><button class="btn primary" data-done>Done</button></div>`)}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-done],[data-nav],[data-k],[data-theme-pick],[data-accent],[data-act],[data-close],#qx');if(!t)return;
 if(t.hasAttribute('data-done')){modal('');return}
 if(t.hasAttribute('data-close')){if(e.target===t)modal('');return}
 if(t.id==='qx'){query='';document.getElementById('q').value='';t.hidden=true;render();return}
 if(t.dataset.nav){cur=t.dataset.nav;query='';document.getElementById('q').value='';document.getElementById('qx').hidden=true;
  try{history.replaceState(null,'','#'+cur)}catch(_){};render();return}
 if(t.dataset.accent){S.accent=t.dataset.accent;save();render();flash();return}
 if(t.dataset.themePick){S.theme=t.dataset.themePick;save();render();flash();return}
 if(t.dataset.act){const a=t.dataset.act;
  if(a==='browse'){S.file=S.file==='new-mail-chime.wav'?'soft-bell.mp3':'new-mail-chime.wav';playing=null;save();renderPane();flash()}
  else if(a==='play'){playing=playing?null:1;renderPane();if(playing){const id=playing=Date.now();setTimeout(()=>{if(playing===id){playing=null;renderPane()}},2200)}}
  else if(a==='pickdir'){S.dlpath=S.dlpath==='~/Downloads'?'~/Documents/Mail attachments':'~/Downloads';save();renderPane();flash()}
  else if(a==='stub')toast('Not wired up in this prototype');
  else if(a==='appicons')dlgIcons();
  else if(a==='alerts')dlgAlerts();
  return}
 if(t.dataset.k){const k=t.dataset.k;
  if(t.classList.contains('sw'))S[k]=!S[k];
  else if(t.dataset.v!==undefined)S[k]=t.dataset.v;
  else return;
  save();
  if(t.dataset.modal){k==='iconBadge'||k==='alertBadge'?dlgIcons():dlgAlerts();return}
  if(k==='sound'&&!S.sound)playing=null;
  render();flash()}
});
document.addEventListener('change',e=>{
 const tg=e.target;
 if(tg.dataset&&tg.dataset.k&&(tg.type==='radio'||tg.type==='checkbox')){const k=tg.dataset.k;S[k]=tg.type==='radio'?tg.value:tg.checked;save();
  const q=tg.type==='radio'?`input[data-k="${k}"][value="${tg.value}"]`:`input[data-k="${k}"]`;const m=document.querySelector('main'),st=m.scrollTop;render();m.scrollTop=st;
  const n=document.querySelector(q);if(n)n.focus({preventScroll:true});flash();return}
 if(e.target.dataset&&e.target.dataset.acct){switchAcct(e.target.value);save();render();flash();return}
 const k=e.target.dataset&&e.target.dataset.k;if(k&&e.target.tagName==='SELECT'){S[k]=e.target.value;save();flash()}});
document.addEventListener('input',e=>{
 if(e.target.type==='text'&&e.target.dataset.k){S[e.target.dataset.k]=e.target.value;save();flash();return}
 if(e.target.id==='q'){query=e.target.value.trim();document.getElementById('qx').hidden=!query;renderNav();renderPane();return}
 if(e.target.type==='range'){S.fontsize=+e.target.value;applyTheme();e.target.parentNode.querySelector('output').textContent=S.fontsize+'%';save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal('')});
document.getElementById('ic-search').innerHTML=ic('search',22);
renderRail();render();
</script>
